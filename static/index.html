<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ASB FreeCodes</title>
<meta name="theme-color" content="#0b0f1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎁%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0f1f; --surface:rgba(255,255,255,.06); --surface2:rgba(255,255,255,.1); --line:rgba(255,255,255,.1);
  --text:#eef1ff; --muted:#98a2cc; --gold:#ffc83d; --gold2:#ff9a1f; --vio:#7c5cff; --cy:#22d3ee;
  --pink:#ff4d8d; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --red:#ff4545;
  --shadow:0 10px 30px rgba(0,0,0,.35); --r:20px; --nav:74px;
  --top:max(env(safe-area-inset-top,0px),var(--tg-content-safe-area-inset-top,0px));
  --bot:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#f2f4ff; --surface:#ffffff; --surface2:#eceffd; --line:rgba(20,30,80,.1);
  --text:#141a3a; --muted:#5d678f; --shadow:0 8px 24px rgba(40,50,120,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none}
body::before{width:420px;height:420px;background:var(--vio);opacity:.38;top:-150px;left:-130px}
body::after{width:380px;height:380px;background:var(--pink);opacity:.22;bottom:-140px;right:-120px}
html[data-theme="light"] body::before,html[data-theme="light"] body::after{opacity:.12}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font-family:inherit}
[hidden]{display:none!important}
.mut{color:var(--muted)}

/* layout */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 12px) 16px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.av{flex:none;display:grid;place-items:center;border-radius:50%;font-weight:800;color:#fff;overflow:hidden;text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover}
.hdr-txt{flex:1;min-width:0;line-height:1.25}
.hdr-txt small{color:var(--muted);font-size:.74rem}
.hdr-txt b{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.74rem;font-weight:800;background:rgba(255,69,69,.15);color:var(--red);animation:pop 1.6s infinite}
.live-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
@keyframes pop{50%{transform:scale(1.07)}}
main{padding:4px 16px calc(var(--nav) + var(--bot) + 28px);max-width:640px;margin:0 auto}
.tab{display:none;animation:fade .3s}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.h2{font-size:1.25rem;font-weight:800;margin:6px 2px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.h2 small{font-size:.76rem;font-weight:600;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h3{font-size:1rem;margin-bottom:4px}
.card p{font-size:.88rem;color:var(--muted)}
.hero{background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(255,77,141,.25));border-color:rgba(255,255,255,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 8px;text-align:center;border-radius:16px;background:var(--surface2)}
.stat b{display:block;font-size:1.45rem;font-weight:800;line-height:1.2}
.stat span{font-size:.7rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--surface2)}
.pill.ok{background:rgba(52,211,153,.16);color:var(--ok)}
.pill.warn{background:rgba(251,191,36,.16);color:var(--warn)}
.pill.bad{background:rgba(251,113,133,.16);color:var(--bad)}
.pill.live{background:rgba(255,69,69,.16);color:var(--red)}
.notice{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.1)}
.notice b{color:var(--warn)}
.flex{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mt{margin-top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 18px;border-radius:14px;font-weight:700;font-size:.95rem;background:var(--surface2);border:1px solid var(--line);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1800;border:0;box-shadow:0 8px 24px rgba(255,154,31,.35)}
.btn.vio{background:linear-gradient(135deg,var(--vio),var(--pink));color:#fff;border:0}
.btn.sm{width:auto;padding:9px 16px;font-size:.84rem;border-radius:11px}
.claim{position:relative;width:100%;padding:22px 16px;border-radius:22px;font-size:1.35rem;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,#ff4545,#ff8a1f);box-shadow:0 12px 36px rgba(255,69,69,.5);animation:ring 1.4s infinite}
.claim:active{transform:scale(.96)}
.claim[disabled]{animation:none;opacity:.6}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,100,60,.6),0 12px 36px rgba(255,69,69,.5)}100%{box-shadow:0 0 0 22px rgba(255,100,60,0),0 12px 36px rgba(255,69,69,.5)}}

/* progress */
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .5s}
.dots{display:flex;gap:6px;margin:10px 0}
.dots span{flex:1;height:8px;border-radius:99px;background:var(--surface2)}
.dots span.on{background:linear-gradient(90deg,var(--gold),var(--gold2))}

/* countdown */
.cd{display:flex;gap:10px;justify-content:center;margin:14px 0}
.cd div{min-width:72px;padding:12px 6px;border-radius:16px;background:var(--surface2);text-align:center}
.cd b{display:block;font-size:2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:15px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.item.me{border-color:var(--gold);background:rgba(255,200,61,.1)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small{color:var(--muted);font-size:.74rem}
.chip{padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:rgba(255,200,61,.15);color:var(--gold);white-space:nowrap}
.rk{width:28px;text-align:center;font-weight:800}
.search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.92rem;margin-bottom:12px;user-select:text;-webkit-user-select:text}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:var(--r);margin-bottom:12px}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface2);margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:.86rem;color:var(--muted)}
.seg button.on{background:linear-gradient(135deg,var(--vio),var(--pink));color:#fff}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:8px 0 18px}
.pod{flex:1;max-width:110px;text-align:center}
.pod .av{margin:0 auto 6px}
.pod b{display:block;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod small{color:var(--gold);font-weight:700;font-size:.78rem}
.pod .step{margin-top:6px;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:8px;font-size:1.5rem;background:linear-gradient(180deg,var(--surface2),transparent)}
.code{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);margin-top:8px}
.code code{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;word-break:break-all;user-select:text;-webkit-user-select:text}

/* nav */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 10px);width:min(620px,100% - 20px);height:var(--nav);display:flex;justify-content:space-around;align-items:center;padding:6px;border-radius:26px;background:rgba(18,22,48,.82);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:40}
html[data-theme="light"] nav.tabs{background:rgba(255,255,255,.9)}
nav.tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:18px;font-size:.62rem;font-weight:600;color:var(--muted);transition:.2s}
nav.tabs button i{font-style:normal;font-size:1.4rem;line-height:1;transition:transform .2s}
nav.tabs button.on{color:var(--text);background:var(--surface2)}
nav.tabs button.on i{transform:translateY(-2px) scale(1.12)}
nav.tabs button.hot i{filter:drop-shadow(0 0 8px var(--gold))}
nav.tabs button .dot{position:absolute;top:6px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,69,69,.25);animation:pop 1.2s infinite}

/* sheet + toast */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadeBg .25s}
@keyframes fadeBg{from{opacity:0}}
.sheet{width:min(640px,100%);background:var(--bg);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:24px 20px calc(var(--bot) + 24px);animation:up .3s;text-align:center}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h3{font-size:1.3rem;margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(var(--top) + 14px);transform:translate(-50%,-30px);opacity:0;z-index:80;padding:11px 18px;border-radius:14px;background:#1d2350;color:#fff;font-size:.86rem;font-weight:600;box-shadow:var(--shadow);transition:.3s;max-width:88%;text-align:center;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
canvas#fx{position:fixed;inset:0;z-index:90;pointer-events:none}

/* skeleton + gate */
.sk{height:96px;border-radius:var(--r);margin-bottom:14px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.gate .card{max-width:380px}
.gate .big{font-size:3.2rem}
details.faq{padding:14px 16px;margin-bottom:8px}
details.faq summary{font-weight:600;font-size:.9rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";color:var(--gold);font-size:1.2rem}
details.faq[open] summary::after{content:"–"}
details.faq p{margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="card">
    <div class="big">🎁</div>
    <h3 style="font-size:1.3rem;margin:6px 0">ASB FreeCodes</h3>
    <p>Ye ek <b>Telegram Mini App</b> hai. Isse Telegram ke andar bot se kholein — daily bonus, free code drops, leaderboard sab wahin milega.</p>
    <a id="gateBtn" class="btn gold mt" style="text-decoration:none" href="#">🤖 Bot kholo</a>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="av" id="hdrAv" style="width:44px;height:44px"></div>
    <div class="hdr-txt"><small>Namaste 👋</small><b id="hdrName">…</b></div>
    <span class="live-badge" id="hdrLive" hidden>DROP LIVE</span>
  </header>

  <main>
    <section class="tab active" id="t-home"><div class="sk"></div><div class="sk"></div><div class="sk"></div></section>
    <section class="tab" id="t-entries"></section>
    <section class="tab" id="t-drops"></section>
    <section class="tab" id="t-winners"></section>
    <section class="tab" id="t-board"></section>
    <section class="tab" id="t-me"></section>
  </main>

  <nav class="tabs" id="nav">
    <button data-t="home" class="on"><i>🏠</i>Home</button>
    <button data-t="entries"><i>🎟</i>Entries</button>
    <button data-t="drops" id="navDrops"><i>⚡</i>Drops</button>
    <button data-t="winners"><i>🏆</i>Winners</button>
    <button data-t="board"><i>🏅</i>Board</button>
    <button data-t="me"><i>👤</i>Profile</button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script>
window.APP_CONFIG = /*__CONFIG__*/{};
(function(){
"use strict";
var cfg = window.APP_CONFIG || {};
var tg = window.Telegram && window.Telegram.WebApp;
var inTG = !!(tg && tg.initData);
var $ = function(s,r){return (r||document).querySelector(s)};
var MILES = [3,7,14,30];
var S = {data:null, tab:"home", offset:0, board:"refs", search:"", loading:false, timer:null, fired:{}};

/* ------------------------------------------------ helpers */
function el(tag,cls,text){var n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=text; return n;}
function now(){return Date.now()+S.offset;}
function num(n){return (+n||0).toLocaleString("en-IN");}
function hue(name){var h=0,s=String(name||"");for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h;}
function avatar(name,size,photo){
  var a=el("div","av"); a.style.width=a.style.height=size+"px"; a.style.fontSize=(size*.42)+"px";
  var h=hue(name); a.style.background="linear-gradient(135deg,hsl("+h+" 75% 55%),hsl("+((h+50)%360)+" 75% 45%))";
  a.textContent=(String(name||"?").trim().charAt(0)||"?");
  if(photo){var im=new Image(); im.onload=function(){a.textContent="";a.appendChild(im);}; im.src=photo;}
  return a;
}
function ago(iso){
  if(!iso) return ""; var s=Math.max(1,(now()-new Date(iso).getTime())/1000);
  if(s<60) return "abhi abhi"; if(s<3600) return Math.floor(s/60)+" min pehle";
  if(s<86400) return Math.floor(s/3600)+" ghante pehle"; return Math.floor(s/86400)+" din pehle";
}
function istTime(iso){
  try{return new Date(iso).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true,day:"2-digit",month:"short"});}catch(e){return "";}
}
function sec(ms){return (ms/1000).toFixed(1)+" sec";}
function haptic(k){try{tg.HapticFeedback.impactOccurred(k||"light");}catch(e){}}
function notify(k){try{tg.HapticFeedback.notificationOccurred(k||"success");}catch(e){}}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},2600);}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:"#";}
function openLink(u){
  u=safeUrl(u); if(u==="#")return;
  try{ if(/^https?:\/\/t\.me\//i.test(u)&&tg&&tg.openTelegramLink) return tg.openTelegramLink(u);
       if(tg&&tg.openLink) return tg.openLink(u);}catch(e){}
  window.open(u,"_blank","noopener");
}
function openBot(){openLink(cfg.bot_link||("https://t.me/"+cfg.bot_username));}
function copy(text,msg){
  var done=function(){toast(msg||"✅ Copy ho gaya");notify("success");};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback);}else fallback();
  function fallback(){var i=document.createElement("input");i.value=text;document.body.appendChild(i);i.select();try{document.execCommand("copy");}catch(e){}i.remove();done();}
}
function B(label,cls,fn){var b=el("button","btn "+(cls||""),label); if(fn)b.addEventListener("click",function(){haptic();fn(b);}); return b;}
function card(cls){return el("div","card "+(cls||""));}
function empty(t){return el("div","empty",t);}

/* ------------------------------------------------ api */
function api(path,extra){
  var body=Object.assign({initData:tg.initData},extra||{});
  return fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {ok:false,error:"bad response"}});});
}
function load(){
  if(S.loading) return Promise.resolve();
  S.loading=true;
  return api("/api/app").then(function(d){
    S.loading=false;
    if(!d||!d.ok){ if(d&&d.error==="unauthorized") toast("Session expire — app dobara kholein"); return; }
    S.data=d; S.offset=d.server_ms-Date.now(); render();
  }).catch(function(){S.loading=false;});
}
function nextDelay(){
  var cur=S.data&&S.data.drops.current;
  if(cur){ if(cur.status==="live") return 3000;
    var rem=(new Date(cur.go_live_at).getTime()-now())/1000; if(rem<150) return 3000; }
  return 20000;
}
function loop(){ if(document.hidden){S.timer=setTimeout(loop,3000);return;} load().then(function(){S.timer=setTimeout(loop,nextDelay());}); }
function burst(){var n=0;(function b(){load().then(function(){var c=S.data&&S.data.drops.current;if((!c||c.status!=="live")&&n++<14)setTimeout(b,700);});})();}

/* ------------------------------------------------ tabs */
function go(t){
  S.tab=t; haptic("light");
  document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("active",x.id==="t-"+t);});
  document.querySelectorAll("#nav button").forEach(function(x){x.classList.toggle("on",x.getAttribute("data-t")===t);});
  window.scrollTo(0,0);
}
document.querySelectorAll("#nav button").forEach(function(b){b.addEventListener("click",function(){go(b.getAttribute("data-t"));});});

/* ------------------------------------------------ renderers */
function render(){
  var d=S.data; if(!d) return;
  var me=d.me, cur=d.drops.current;
  $("#hdrName").textContent=me.name||"Dost";
  var hA=$("#hdrAv"); hA.textContent=""; var photo=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.photo_url;
  var av=avatar(me.name,44,photo); hA.style.background=av.style.background; hA.style.fontSize=av.style.fontSize; hA.textContent=av.textContent; if(photo){var im=new Image();im.onload=function(){hA.textContent="";hA.appendChild(im);};im.src=photo;}
  var live=cur&&cur.status==="live"; $("#hdrLive").hidden=!live;
  var nd=$("#navDrops"); nd.classList.toggle("hot",!!cur); var old=$(".dot",nd); if(old)old.remove(); if(live) nd.appendChild(el("span","dot"));
  renderHome(d); renderEntries(d); renderDrops(d); renderWinners(d); renderBoard(d); renderMe(d);
  tick();
}

function cdBoxes(iso){
  var w=el("div","cd"); w.setAttribute("data-cd",iso);
  [["h","Ghante"],["m","Minute"],["s","Second"]].forEach(function(x){var b=el("div"); b.appendChild(el("b",null,"00")).className="cd-"+x[0]; b.appendChild(el("span",null,x[1])); w.appendChild(b);});
  return w;
}
function cdInline(iso){var s=el("b",null,"--:--"); s.setAttribute("data-cdt",iso); return s;}
function two(n){return (n<10?"0":"")+n;}
function tick(){
  var t=now();
  document.querySelectorAll("[data-cd]").forEach(function(w){
    var iso=w.getAttribute("data-cd"), rem=Math.max(0,Math.floor((new Date(iso).getTime()-t)/1000));
    var h=Math.floor(rem/3600), m=Math.floor(rem%3600/60), s=rem%60;
    $(".cd-h",w).textContent=two(h); $(".cd-m",w).textContent=two(m); $(".cd-s",w).textContent=two(s);
    if(rem===0&&!S.fired[iso]){S.fired[iso]=1;burst();}
  });
  document.querySelectorAll("[data-cdt]").forEach(function(s){
    var iso=s.getAttribute("data-cdt"), rem=Math.max(0,Math.floor((new Date(iso).getTime()-t)/1000));
    var h=Math.floor(rem/3600), m=Math.floor(rem%3600/60), x=rem%60;
    s.textContent=(h?h+":"+two(m):two(m))+":"+two(x);
    if(rem===0&&!S.fired[iso]){S.fired[iso]=1;burst();}
  });
}
setInterval(tick,250);

function renderHome(d){

function claimDrop(no,btn){
  btn.disabled=true; haptic("heavy");
  api("/api/claim",{drop:no}).then(function(r){
    var m={not_live:"⏳ Drop abhi live nahi hua",ended:"❌ Drop khatam ho chuka hai",sold_out:"😔 Saare codes claim ho chuke",unverified:"🛡 Pehle bot me Verify karein",not_found:"Drop nahi mila"};
    if(r.status==="ok"||r.status==="duplicate"){ if(r.code){showCode(r);} notify("success"); if(r.status==="ok")confetti(); else toast("✅ Aap pehle hi claim kar chuke ho"); }
    else { toast(m[r.status]||"Kuch gadbad hui, dobara try karein"); notify("error"); }
    load();
  }).catch(function(){toast("Network error");btn.disabled=false;});
}
function claimDaily(btn){
  btn.disabled=true;
  api("/api/daily").then(function(r){
    if(r.status==="ok"){notify("success");confetti();toast("🎁 Streak "+r.streak+" din!"+(r.reward?" +"+r.reward+" ticket 🎟":""));}
    else if(r.status==="already") toast("✅ Aaj ka bonus pehle hi le liya");
    else if(r.status==="unverified") toast("🛡 Pehle bot me Verify karein");
    else toast("Kuch gadbad hui");
    load();
  }).catch(function(){toast("Network error");btn.disabled=false;});
}

/* ------------------------------------------------ confetti */
function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c=$("#fx"),x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  var P=[],cols=["#ffc83d","#ff4d8d","#7c5cff","#22d3ee","#34d399"];
  for(var i=0;i<90;i++)P.push({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,s:Math.random()*7+4,c:cols[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  var f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});if(++f<110)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height);})();
}
